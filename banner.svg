<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Dikson Rodrigues - Automation, AI, Dashboards, Systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#050a14"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8ecf0"/>
      <stop offset="40%" stop-color="#c9d1d9"/>
      <stop offset="60%" stop-color="#8a93a3"/>
      <stop offset="100%" stop-color="#c9d1d9"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hex" width="40" height="34.64" patternUnits="userSpaceOnUse">
      <path d="M20 0 L40 10 L40 24.64 L20 34.64 L0 24.64 L0 10 Z" fill="none" stroke="#1b263b" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#hex)" opacity="0.5"/>

  <!-- circuit lines -->
  <g stroke="#00b4d8" stroke-width="1" opacity="0.35" filter="url(#glow)">
    <path d="M0 80 H260 L300 120 H520"/>
    <path d="M1280 240 H1020 L980 200 H760"/>
    <path d="M0 260 H180 L220 220 H400"/>
    <path d="M1280 60 H1100 L1060 100 H880"/>
  </g>
  <!-- nodes -->
  <g fill="#00b4d8" filter="url(#glow)">
    <circle cx="260" cy="80" r="3"/><circle cx="300" cy="120" r="3"/><circle cx="520" cy="120" r="3"/>
    <circle cx="1020" cy="240" r="3"/><circle cx="980" cy="200" r="3"/><circle cx="760" cy="200" r="3"/>
    <circle cx="180" cy="260" r="3"/><circle cx="220" cy="220" r="3"/><circle cx="400" cy="220" r="3"/>
    <circle cx="1100" cy="60" r="3"/><circle cx="1060" cy="100" r="3"/><circle cx="880" cy="100" r="3"/>
  </g>

  <!-- scan line -->
  <rect x="0" y="158" width="1280" height="1" fill="url(#cyan)" opacity="0.6"/>

  <!-- title -->
  <text x="640" y="138" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="62" font-weight="800" fill="url(#metal)" filter="url(#softglow)" letter-spacing="2">Dikson Rodrigues</text>
  <!-- subtitle -->
  <text x="640" y="182" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#00b4d8" letter-spacing="6">AUTOMATION  ·  AI  ·  DASHBOARDS  ·  SYSTEMS</text>

  <!-- bottom accent bar -->
  <rect x="440" y="205" width="400" height="2" fill="url(#cyan)" opacity="0.8"/>

  <!-- corner brackets -->
  <g stroke="#c9d1d9" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M24 24 H64 M24 24 V64"/>
    <path d="M1256 24 H1216 M1256 24 V64"/>
    <path d="M24 296 H64 M24 296 V256"/>
    <path d="M1256 296 H1216 M1256 296 V256"/>
  </g>
</svg>